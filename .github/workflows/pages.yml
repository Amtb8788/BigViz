name: Demo (GitHub Pages)

# Builds the Vue 3 template and publishes it as the live demo:
#   https://amtb8788.github.io/BigViz/         → 2D example screen
#   https://amtb8788.github.io/BigViz/#/city   → 3D digital-twin city
# One-time setup: repo Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - templates/vue3-echarts/**
      - docs/media/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/vue3-echarts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: templates/vue3-echarts/package-lock.json
      - run: npm ci
      - run: npm run build
      # Promo video player: https://amtb8788.github.io/BigViz/promo/
      - name: Add promo video page
        run: |
          mkdir -p dist/promo
          cp ../../docs/media/promo.html dist/promo/index.html
          cp ../../docs/media/bigviz-promo.mp4 ../../docs/media/bigviz-promo-poster.jpg dist/promo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: templates/vue3-echarts/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
